
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#000000">
<title>FPS AR - Protótipo</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
  color: white;
  font-family: Arial, sans-serif;
  touch-action: none;
  overscroll-behavior: none;
}

#camera {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: contain;
  object-position: center;
  background: #000;
  z-index: 0;
}

#effects {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 1;
  pointer-events: none;
}

#hud {
  position: fixed;
  inset: 0;
  z-index: 2;
  pointer-events: none;
}

button {
  border: 1px solid #ffffff70;
  border-radius: 10px;
  background: #101820e8;
  color: white;
  padding: 12px 16px;
  font-size: 14px;
  font-weight: bold;
}

#crosshair {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 25px;
  height: 25px;
  transform: translate(-50%, -50%);
}

#crosshair::before,
#crosshair::after {
  content: "";
  position: absolute;
  background: white;
  box-shadow: 0 0 5px black;
}

#crosshair::before {
  width: 2px;
  height: 25px;
  left: 11px;
}

#crosshair::after {
  width: 25px;
  height: 2px;
  top: 11px;
}

#shoot {
  position: absolute;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%);
  width: 130px;
  height: 58px;
  border-radius: 30px;
  background: #087bce;
  border: 2px solid #8bd5ff;
  box-shadow: 0 0 15px #008cff80;
  pointer-events: auto;
  font-size: 16px;
}

#settingsButton {
  position: absolute;
  top: 16px;
  right: 12px;
  pointer-events: auto;
}

#cameraButton {
  position: absolute;
  top: 16px;
  left: 12px;
  pointer-events: auto;
}

#settings {
  display: none;
  position: fixed;
  z-index: 5;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: min(90%, 390px);
  max-height: 85vh;
  overflow-y: auto;
  padding: 20px;
  border: 1px solid #ffffff50;
  border-radius: 15px;
  background: #101820f5;
  box-shadow: 0 0 30px #000;
  touch-action: pan-y;
}

#settings h2 {
  margin-top: 0;
}

.setting {
  margin: 17px 0;
}

.setting label {
  display: block;
  margin-bottom: 9px;
}

.colors {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  padding: 5px;
}

.color {
  width: 35px;
  height: 35px;
  border: 3px solid #ffffff70;
  border-radius: 50%;
  padding: 0;
}

.color.selected {
  outline: 3px solid white;
  outline-offset: 3px;
}

input[type="range"] {
  width: 100%;
}

select {
  width: 100%;
  padding: 10px;
  border-radius: 8px;
  background: #263746;
  color: white;
  border: 1px solid #ffffff50;
}

.toggle {
  display: flex !important;
  align-items: center;
  gap: 10px;
}

#closeSettings {
  width: 100%;
  margin-top: 12px;
}

#message {
  position: fixed;
  z-index: 4;
  top: 75px;
  left: 50%;
  transform: translateX(-50%);
  background: #000c;
  padding: 10px 14px;
  border-radius: 8px;
  font-size: 13px;
  display: none;
  max-width: 90%;
  text-align: center;
}
</style>
</head>

<body>

<video id="camera" autoplay playsinline muted></video>
<canvas id="effects"></canvas>

<div id="hud">
  <div id="crosshair"></div>
  <button id="cameraButton">CÂMERA</button>
  <button id="settingsButton">⚙ CONFIGURAÇÕES</button>
  <button id="shoot">DISPARAR</button>
</div>

<div id="message"></div>

<div id="settings">
  <h2>Configurações</h2>

  <div class="setting">
    <label>Cor dos disparos</label>
    <div class="colors">
      <button class="color selected" data-color="#00aaff" style="background:#00aaff"></button>
      <button class="color" data-color="#ff2020" style="background:#ff2020"></button>
      <button class="color" data-color="#00ff66" style="background:#00ff66"></button>
      <button class="color" data-color="#b000ff" style="background:#b000ff"></button>
      <button class="color" data-color="#ffe600" style="background:#ffe600"></button>
      <button class="color" data-color="#ffffff" style="background:#ffffff"></button>
    </div>
  </div>

  <div class="setting">
    <label>Qualidade dos efeitos</label>
    <select id="quality">
      <option value="high">Alta</option>
      <option value="medium">Média</option>
      <option value="low">Baixa</option>
    </select>
  </div>

  <div class="setting">
    <label class="toggle">
      <input type="checkbox" id="glow" checked>
      Brilho dos disparos
    </label>
  </div>

  <div class="setting">
    <label class="toggle">
      <input type="checkbox" id="trails" checked>
      Rastros luminosos
    </label>
  </div>

  <div class="setting">
    <label class="toggle">
      <input type="checkbox" id="explosions" checked>
      Clarão dos impactos
    </label>
  </div>

  <hr>

  <h3>Áudio</h3>

  <div class="setting">
    <label class="toggle">
      <input type="checkbox" id="audioEnabled" checked>
      Ativar áudio
    </label>
  </div>

  <div class="setting">
    <label>Volume geral</label>
    <input type="range" id="volume" min="0" max="100" value="85">
  </div>

  <div class="setting">
    <label class="toggle">
      <input type="checkbox" id="shotSound" checked>
      Som dos disparos
    </label>
  </div>

  <div class="setting">
    <label class="toggle">
      <input type="checkbox" id="impactSound" checked>
      Som dos impactos
    </label>
  </div>

  <button id="closeSettings">FECHAR</button>
</div>

<script>
const camera = document.getElementById("camera");
const canvas = document.getElementById("effects");
const ctx = canvas.getContext("2d");

let projectiles = [];
let impacts = [];
let selectedColor = "#00aaff";
let audioContext = null;
let cameraStream = null;
let cameraTrack = null;

const settings = {
  glow: true,
  trails: true,
  explosions: true,
  quality: "high",
  audio: true,
  shotSound: true,
  impactSound: true,
  volume: 0.85
};

// ----------------------------------
// CANVAS
// ----------------------------------

function resizeCanvas() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);

  canvas.width = window.innerWidth * dpr;
  canvas.height = window.innerHeight * dpr;

  canvas.style.width = window.innerWidth + "px";
  canvas.style.height = window.innerHeight + "px";

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

window.addEventListener("resize", resizeCanvas);
resizeCanvas();

function showMessage(text) {
  const el = document.getElementById("message");
  el.textContent = text;
  el.style.display = "block";

  clearTimeout(showMessage.timer);

  showMessage.timer = setTimeout(() => {
    el.style.display = "none";
  }, 2500);
}

// ----------------------------------
// ÁUDIO
// ----------------------------------

function initAudio() {
  if (!audioContext) {
    audioContext = new (
      window.AudioContext ||
      window.webkitAudioContext
    )();
  }

  if (audioContext.state === "suspended") {
    audioContext.resume();
  }
}

// Som de blaster com efeito PSIUUU
function playShotSound() {
  if (!settings.audio || !settings.shotSound) return;

  initAudio();

  const now = audioContext.currentTime;

  const compressor = audioContext.createDynamicsCompressor();

  compressor.threshold.value = -18;
  compressor.knee.value = 10;
  compressor.ratio.value = 6;
  compressor.attack.value = 0.003;
  compressor.release.value = 0.15;

  compressor.connect(audioContext.destination);

  const master = audioContext.createGain();

  master.gain.setValueAtTime(0.0001, now);
  master.gain.exponentialRampToValueAtTime(
    settings.volume * 0.72,
    now + 0.012
  );
  master.gain.exponentialRampToValueAtTime(
    0.0001,
    now + 0.52
  );

  master.connect(compressor);

  // Assobio principal
  const osc = audioContext.createOscillator();
  const oscGain = audioContext.createGain();

  osc.type = "sawtooth";

  osc.frequency.setValueAtTime(2800, now);
  osc.frequency.exponentialRampToValueAtTime(
    430,
    now + 0.46
  );

  oscGain.gain.setValueAtTime(0.55, now);
  oscGain.gain.exponentialRampToValueAtTime(
    0.001,
    now + 0.48
  );

  osc.connect(oscGain);
  oscGain.connect(master);

  osc.start(now);
  osc.stop(now + 0.49);

  // Camada de assobio mais suave
  const high = audioContext.createOscillator();
  const highGain = audioContext.createGain();

  high.type = "triangle";

  high.frequency.setValueAtTime(3600, now);
  high.frequency.exponentialRampToValueAtTime(
    900,
    now + 0.35
  );

  highGain.gain.setValueAtTime(0.3, now);
  highGain.gain.exponentialRampToValueAtTime(
    0.001,
    now + 0.36
  );

  high.connect(highGain);
  highGain.connect(master);

  high.start(now);
  high.stop(now + 0.37);

  // Ruído filtrado para dar sensação de velocidade
  const duration = 0.42;
  const buffer = audioContext.createBuffer(
    1,
    Math.floor(audioContext.sampleRate * duration),
    audioContext.sampleRate
  );

  const data = buffer.getChannelData(0);

  for (let i = 0; i < data.length; i++) {
    data[i] = Math.random() * 2 - 1;
  }

  const noise = audioContext.createBufferSource();
  const filter = audioContext.createBiquadFilter();
  const noiseGain = audioContext.createGain();

  noise.buffer = buffer;

  filter.type = "bandpass";
  filter.frequency.setValueAtTime(3200, now);
  filter.frequency.exponentialRampToValueAtTime(
    700,
    now + duration
  );
  filter.Q.value = 1.4;

  noiseGain.gain.setValueAtTime(0.16, now);
  noiseGain.gain.exponentialRampToValueAtTime(
    0.001,
    now + duration
  );

  noise.connect(filter);
  filter.connect(noiseGain);
  noiseGain.connect(master);

  noise.start(now);
  noise.stop(now + duration);
}

function playImpactSound() {
  if (!settings.audio || !settings.impactSound) return;

  initAudio();

  const now = audioContext.currentTime;

  const osc = audioContext.createOscillator();
  const gain = audioContext.createGain();

  osc.type = "triangle";
  osc.frequency.setValueAtTime(190, now);
  osc.frequency.exponentialRampToValueAtTime(
    45,
    now + 0.23
  );

  gain.gain.setValueAtTime(
    settings.volume * 0.35,
    now
  );

  gain.gain.exponentialRampToValueAtTime(
    0.001,
    now + 0.25
  );

  osc.connect(gain);
  gain.connect(audioContext.destination);

  osc.start(now);
  osc.stop(now + 0.26);
}

// ----------------------------------
// DISPAROS
// ----------------------------------

function shoot() {
  initAudio();
  playShotSound();

  if (projectiles.length >= 12) {
    projectiles.shift();
  }

  const w = window.innerWidth;
  const h = window.innerHeight;

  projectiles.push({
    startX: w / 2,
    startY: h * 0.96,

    targetX: w / 2,
    targetY: h * 0.50,

    progress: 0,

    // Maior valor = deslocamento mais rápido
    speed: settings.quality === "low" ? 0.038 :
           settings.quality === "medium" ? 0.032 :
           0.028,

    color: selectedColor,
    size: settings.quality === "low" ? 24 : 32,

    previousX: w / 2,
    previousY: h * 0.96,

    // Pequena variação para dar naturalidade
    drift: (Math.random() - 0.5) * 5
  });
}

// ----------------------------------
// DESENHO DO PROJÉTIL
// ----------------------------------

function drawProjectile(p) {
  const t = Math.min(p.progress, 1);

  // Aceleração visual do deslocamento
  const movement = t * t * (3 - 2 * t);

  const x =
    p.startX +
    (p.targetX - p.startX) * movement +
    Math.sin(t * Math.PI) * p.drift;

  const y =
    p.startY +
    (p.targetY - p.startY) * movement;

  // Diminui conforme avança para longe
  const perspective = Math.pow(1 - t, 1.65);

  const radius = Math.max(
    1.2,
    p.size * perspective
  );

  // Comprimento do rastro
  const trailLength = 0.18 * (1 - t);

  if (settings.trails) {
    const trailT = Math.max(0, t - trailLength);

    const trailMovement =
      trailT * trailT * (3 - 2 * trailT);

    const trailX =
      p.startX +
      (p.targetX - p.startX) * trailMovement;

    const trailY =
      p.startY +
      (p.targetY - p.startY) * trailMovement;

    ctx.save();

    ctx.lineCap = "round";

    const gradient = ctx.createLinearGradient(
      x, y, trailX, trailY
    );

    gradient.addColorStop(0, "#ffffff");
    gradient.addColorStop(0.18, p.color);
    gradient.addColorStop(1, "transparent");

    ctx.strokeStyle = gradient;

    ctx.lineWidth = Math.max(
      1,
      radius * 1.15
    );

    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(trailX, trailY);
    ctx.stroke();

    ctx.restore();
  }

  // Halo luminoso
  if (settings.glow) {
    ctx.save();

    ctx.globalAlpha = Math.max(0.25, 1 - t * 0.65);

    ctx.shadowColor = p.color;
    ctx.shadowBlur =
      settings.quality === "high" ? 30 :
      settings.quality === "medium" ? 18 : 8;

    ctx.fillStyle = p.color;

    ctx.beginPath();
    ctx.arc(x, y, radius * 1.25, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }

  // Corpo colorido
  ctx.save();

  ctx.globalAlpha = Math.max(0.35, 1 - t * 0.5);
  ctx.fillStyle = p.color;

  ctx.beginPath();
  ctx.arc(x, y, radius, 0, Math.PI * 2);
  ctx.fill();

  // Núcleo branco
  ctx.fillStyle = "#ffffff";

  ctx.beginPath();
  ctx.arc(
    x,
    y,
    Math.max(1, radius * 0.35),
    0,
    Math.PI * 2
  );
  ctx.fill();

  ctx.restore();

  p.previousX = x;
  p.previousY = y;

  return { x, y };
}

// ----------------------------------
// IMPACTOS
// ----------------------------------

function createImpact(x, y, color) {
  impacts.push({
    x,
    y,
    color,
    life: 1
  });

  playImpactSound();
}

function drawImpact(p) {
  if (!settings.explosions) return;

  const radius = (1 - p.life) * 38 + 3;

  ctx.save();

  ctx.globalAlpha = p.life;
  ctx.shadowColor = p.color;
  ctx.shadowBlur = 20;

  ctx.strokeStyle = p.color;
  ctx.lineWidth = 3;

  ctx.beginPath();
  ctx.arc(p.x, p.y, radius, 0, Math.PI * 2);
  ctx.stroke();

  ctx.fillStyle = "#ffffff";
  ctx.globalAlpha = p.life * 0.8;

  ctx.beginPath();
  ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

// ----------------------------------
// ANIMAÇÃO
// ----------------------------------

function render() {
  const w = window.innerWidth;
  const h = window.innerHeight;

  ctx.clearRect(0, 0, w, h);

  for (let i = projectiles.length - 1; i >= 0; i--) {
    const p = projectiles[i];

    p.progress += p.speed;

    const position = drawProjectile(p);

    if (p.progress >= 1) {
      createImpact(
        position.x,
        position.y,
        p.color
      );

      projectiles.splice(i, 1);
    }
  }

  for (let i = impacts.length - 1; i >= 0; i--) {
    const p = impacts[i];

    drawImpact(p);

    p.life -= 0.055;

    if (p.life <= 0) {
      impacts.splice(i, 1);
    }
  }

  requestAnimationFrame(render);
}

render();

// ----------------------------------
// CÂMERA SEM ZOOM
// ----------------------------------

async function startCamera() {
  try {
    if (!navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia) {
      throw new Error("Câmera não disponível. Use HTTPS.");
    }

    // Encerra a câmera anterior, se existir
    if (cameraStream) {
      cameraStream.getTracks().forEach(track => track.stop());
    }

    // Solicita câmera traseira sem pedir ampliação
    cameraStream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: { ideal: "environment" },
        width: { ideal: 1920 },
        height: { ideal: 1080 }
      },
      audio: false
    });

    camera.srcObject = cameraStream;
    await camera.play();

    cameraTrack = cameraStream.getVideoTracks()[0];

    // Tenta colocar o zoom no mínimo suportado
    await disableCameraZoom(cameraTrack);

    showMessage("Câmera ativada sem zoom adicional");

  } catch (error) {
    console.error(error);

    showMessage(
      "Não foi possível ativar a câmera: " + error.message
    );
  }
}

async function disableCameraZoom(track) {
  if (!track || !track.getCapabilities) return;

  try {
    const capabilities = track.getCapabilities();

    if (capabilities.zoom) {
      const minimumZoom = capabilities.zoom.min;

      await track.applyConstraints({
        advanced: [
          { zoom: minimumZoom }
        ]
      });
    }
  } catch (error) {
    console.warn(
      "O navegador não permitiu alterar o zoom:",
      error
    );
  }
}

// Tenta impedir gestos de zoom na página
document.addEventListener("gesturestart", e => {
  e.preventDefault();
}, { passive: false });

document.addEventListener("gesturechange", e => {
  e.preventDefault();
}, { passive: false });

document.addEventListener("gestureend", e => {
  e.preventDefault();
}, { passive: false });

document.addEventListener("wheel", e => {
  if (e.ctrlKey) e.preventDefault();
}, { passive: false });

// ----------------------------------
// BOTÕES
// ----------------------------------

document.getElementById("cameraButton").onclick =
  startCamera;

document.getElementById("shoot").onclick =
  shoot;

document.getElementById("settingsButton").onclick = () => {
  document.getElementById("settings").style.display = "block";
};

document.getElementById("closeSettings").onclick = () => {
  document.getElementById("settings").style.display = "none";
};

// ----------------------------------
// CORES
// ----------------------------------

document.querySelectorAll(".color").forEach(button => {
  button.onclick = () => {
    document.querySelectorAll(".color").forEach(b => {
      b.classList.remove("selected");
    });

    button.classList.add("selected");
    selectedColor = button.dataset.color;
  };
});

// ----------------------------------
// CONTROLES
// ----------------------------------

document.getElementById("glow").onchange = e => {
  settings.glow = e.target.checked;
};

document.getElementById("trails").onchange = e => {
  settings.trails = e.target.checked;
};

document.getElementById("explosions").onchange = e => {
  settings.explosions = e.target.checked;
};

document.getElementById("quality").onchange = e => {
  settings.quality = e.target.value;
};

document.getElementById("audioEnabled").onchange = e => {
  settings.audio = e.target.checked;
};

document.getElementById("shotSound").onchange = e => {
  settings.shotSound = e.target.checked;
};

document.getElementById("impactSound").onchange = e => {
  settings.impactSound = e.target.checked;
};

document.getElementById("volume").oninput = e => {
  settings.volume = Number(e.target.value) / 100;
};

// ----------------------------------
// ENCERRAMENTO
// ----------------------------------

window.addEventListener("pagehide", () => {
  if (cameraStream) {
    cameraStream.getTracks().forEach(track => track.stop());
  }
});

// Inicia a câmera
startCamera();

</script>
</body>
</html>
