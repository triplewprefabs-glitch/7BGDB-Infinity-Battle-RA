<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>AR Energy Fight</title>
    
    <!-- LINKS 100% COMPLETOS E CORRIGIDOS (SEM CORTES) -->
    <script src="https://cloudflare.com"></script>
    <script src="https://githack.com"></script>
    <script src="https://cloudflare.com"></script>

    <style>
      #permission-screen {
        position: fixed;
        top: 0; left: 0; width: 100vw; height: 100vh;
        background: #111;
        display: flex; flex-direction: column; justify-content: center; align-items: center;
        z-index: 9999; color: white; font-family: sans-serif; text-align: center; padding: 20px;
        box-sizing: border-box;
      }
      .btn-primary { padding: 18px 36px; font-size: 18px; font-weight: bold; background: #00cc66; color: white; border: none; border-radius: 8px; cursor: pointer; }
      .ui-panel { position: absolute; z-index: 999; padding: 12px; background: rgba(0,0,0,0.85); color: white; font-family: sans-serif; border-radius: 8px; }
      #setup { top: 10px; left: 10px; }
      #controls { bottom: 20px; left: 50%; transform: translateX(-50%); display: none; width: 90vw; text-align: center; }
      .btn-shoot { background: #ff0055; color: white; width: 100%; height: 65px; font-size: 22px; font-weight: bold; border-radius: 8px; border: none; }
      input { padding: 10px; width: 140px; margin-right: 5px; border-radius: 5px; border: 1px solid #555; background: #222; color: white; }
    </style>
  </head>
  <body style="margin: 0; overflow: hidden;">

    <!-- TELA DE INTRODUÇÃO -->
    <div id="permission-screen">
      <h2 style="color: #00ffcc;">AR Energy Fight</h2>
      <p style="margin-bottom: 30px; color: #ccc;">Acesse e libere a câmera do celular para iniciar os disparos de energia.</p>
      <button id="start-camera-btn" class="btn-primary">INICIAR JOGO</button>
    </div>

    <!-- PAINEL MULTIPLAYER -->
    <div id="setup" class="ui-panel">
      <p id="my-id-text" style="margin: 0 0 8px 0; font-weight: bold; color: #00ffcc;">Conectando ao servidor...</p>
      <input type="text" id="peer-id-input" placeholder="ID do rival">
      <button id="connect-btn" style="background: #00cc66; color: white; padding: 10px 14px; border: none; border-radius: 5px; font-weight: bold;">Conectar</button>
    </div>

    <!-- BOTÃO DE DISPARO -->
    <div id="controls">
      <button id="shoot-btn" class="btn-shoot">DISPARAR BOLA DE ENERGIA</button>
    </div>

    <script>
      const startBtn = document.getElementById('start-camera-btn');
      const permissionScreen = document.getElementById('permission-screen');
      const setupPanel = document.getElementById('setup');
      const controlsPanel = document.getElementById('controls');
      
      let peer = null;
      let conn = null;

      // Inicia a conexão assim que a página terminar de estruturar os scripts carregados
      window.addEventListener('DOMContentLoaded', () => {
        inicializarMultiplayer();
      });

      startBtn.addEventListener('click', () => {
        permissionScreen.style.display = 'none';
        
        // Monta a cena AR usando as bibliotecas completas carregadas
        const cena = document.createElement('a-scene');
        cena.setAttribute('embedded', '');
        cena.setAttribute('arjs', 'sourceType: webcam; debugUIEnabled: false;');
        
        cena.innerHTML = `
          <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
          <a-marker preset="hiro" id="game-world">
            <!-- As esferas de energia surgem neste espaço -->
          </a-marker>
        `;
        
        document.body.appendChild(cena);
      });

      function inicializarMultiplayer() {
        try {
          // Cria a conexão na infraestrutura estável oficial do PeerJS
          peer = new Peer(); 

          peer.on('open', (id) => {
            document.getElementById('my-id-text').innerText = `Seu ID: ${id}`;
          });

          peer.on('error', (err) => {
            document.getElementById('my-id-text').innerText = `Erro de Conexão`;
            console.error(err);
          });

          peer.on('connection', (connection) => {
            conn = connection;
            liberarControles();
          });

          document.getElementById('connect-btn').addEventListener('click', () => {
            const targetId = document.getElementById('peer-id-input').value.trim();
            if (targetId && peer) {
              conn = peer.connect(targetId);
              liberarControles();
            }
          });
        } catch(e) {
          document.getElementById('my-id-text').innerText = `Erro de Script`;
          console.error(e);
        }
      }

      function liberarControles() {
        setupPanel.style.display = 'none';
        controlsPanel.style.display = 'block';

        if (conn) {
          conn.on('data', (data) => {
            if (data.type === 'shoot') {
              visualizarTiro(data.origin, data.direction, 'inimigo');
            }
          });
        }
      }

      document.getElementById('shoot-btn').addEventListener('click', () => {
        if (!conn) return;
        const camera = document.querySelector('a-camera');
        const camPos = camera ? camera.getAttribute('position') : {x: 0, y: 0, z: 0};
        const direction = { x: 0, y: 0.5, z: -1 }; 

        conn.send({ type: 'shoot', origin: camPos, direction: direction });
        visualizarTiro(camPos, direction, 'meu');
      });

      function visualizarTiro(origem, direcao, tipo) {
        const gameWorld = document.getElementById('game-world');
        if (!gameWorld) return;

        const bola = document.createElement('a-sphere');
        bola.setAttribute('position', `${origem.x} 0.1 ${origem.z}`);
        bola.setAttribute('radius', '0.12');
        bola.setAttribute('color', tipo === 'meu' ? '#00ffff' : '#ff0055');
        
        bola.setAttribute('animation', `property: position; to: ${origem.x + direcao.x * 5} ${origem.y + direcao.y * 5} ${origem.z + direcao.z * 5}; dur: 1200; easing: linear`);
        
        gameWorld.appendChild(bola);
        setTimeout(() => { bola.remove(); }, 1200);
      }
    </script>
  </body>
</html>
