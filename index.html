function parseMap(G,gv,o,tag,mode){const ps=[0,1,2].map(k=>gv.getInt32(o+k*4,true)),pl=[0,1,2].map(k=>gv.getUint16(o+12+k*2,true)),w=gv.getUint16(o+18,true),h=gv.getUint16(o+20,true);
 let nm='';for(let k=0;k<16;k++){const c=G[o+22+k];if(!c)break;nm+=String.fromCharCode(c)}
 const n=Math.max(w,h,1);return{name:nm,n,p:[0,1,2].map(k=>{const a=new Uint16Array(n*n);if(pl[k]>0&&ps[k]>0){const u=unpack(G,ps[k],tag,w*h,mode);for(let y=0;y<h;y++)for(let x=0;x<w;x++)a[y*n+x]=u[y*w+x]}return a})}}
function scanHeaders(G){const gv=new DataView(G.buffer),r=[];
 for(let p=0;p+38<=G.length;){const a=gv.getInt32(p,true),b=gv.getInt32(p+4,true),c=gv.getInt32(p+8,true),la=gv.getUint16(p+12,true),lb=gv.getUint16(p+14,true),lc=gv.getUint16(p+16,true),w=gv.getUint16(p+18,true),h=gv.getUint16(p+20,true);
  let ok=a>=4&&b>=a+la&&(lc==0||c>=b+lb)&&la>2&&lb>2&&a+la<=G.length&&b+lb<=G.length&&w>=2&&w<=1024&&h>=2&&h<=1024&&G[p+22]>32&&G[p+22]<127;
  for(let k=23;ok&&k<38;k++){const v=G[p+k];if(v&&(v<32||v>126))ok=false}
  if(ok){r.push(p);p+=38}else p++}
 return r}
function done(maps){S.head=null;S.maps=maps;S.cur=0;S.un=[];S.re=[];ui();fit();toast(t('opened',maps.length))}
function openWad(u){const v=new DataView(u.buffer),nl=v.getInt32(4,true),dof=v.getInt32(8,true),maps=[];
 for(let i=0;i<nl;i++){const b=dof+i*16;let ln='';for(let k=0;k<8;k++){const c=u[b+8+k];if(!c)break;ln+=String.fromCharCode(c)}
  const o=v.getInt32(b,true),sz=v.getInt32(b+4,true);if(ln.toUpperCase()!='PLANES'||sz<18)continue;
  const np=v.getUint16(o+10,true),nlen=v.getUint16(o+12,true);let nn='';for(let k=0;k<nlen;k++)nn+=String.fromCharCode(u[o+14+k]);
  const w=v.getUint16(o+14+nlen,true),h=v.getUint16(o+16+nlen,true),n=Math.max(w,h,1),base=o+18+nlen;
  maps.push({name:nn||'MAP',n,p:[0,1,2].map(k=>{const a=new Uint16Array(n*n);if(k<np)for(let y=0;y<h;y++)for(let x=0;x<w;x++)a[y*n+x]=v.getUint16(base+(k*w*h+y*w+x)*2,true);return a})})}
 if(!maps.length)return toast(t('wadNo'));done(maps)}
async function openFiles(fl){fl=[...fl];if(!fl.length)return;
 const pj=fl.find(f=>/\.json$/i.test(f.name));
 if(pj){try{loadProject(JSON.parse(await pj.text()));toast(t('projOpen'))}catch(e){toast(t('projBad'))}return}
 const wd=fl.find(f=>/\.wad$/i.test(f.name));if(wd)return openWad(new Uint8Array(await wd.arrayBuffer()));
 const gm=fl.find(f=>/gamemaps/i.test(f.name)),mh=fl.find(f=>/maphead/i.test(f.name));
 if(!gm)return toast(t('openHelp'));
 const ex=((/\.(\w+)$/.exec(gm.name)||[])[1]||'').toUpperCase(),gg=GAMES.find(g=>g[2].includes(ex));if(gg)S.game=gg[0];
 const G=new Uint8Array(await gm.arrayBuffer()),gv=new DataView(G.buffer);let tag=0xABCD,offs=[],H=null;
 if(mh){H=new Uint8Array(await mh.arrayBuffer());const hv=new DataView(H.buffer);tag=hv.getUint16(0,true);for(let i=0;i<100&&2+i*4+4<=H.length;i++){const o=hv.getInt32(2+i*4,true);if(o>0)offs.push(o)}}
 else offs=scanHeaders(G);
 const mode='',maps=[],info=` [${gm.name} ${G.length} B${mh?', '+mh.name+' '+H.length+' B':''}]`;let bad=0,why='';
 for(const o of offs){try{if(o+38>G.length)throw new Error('offset '+o);maps.push(parseMap(G,gv,o,tag,mode))}catch(e){bad++;why=e.message||String(e)}}
 if(!maps.length)return toast((mh?(offs.length?t('readFail'):t('noMaps')):t('noHead'))+info+(why?' '+why:''));
 done(maps);S.head=mh?{tag,tail:H.slice(402)}:null;if(bad)toast(t('opened',maps.length)+' · '+bad+' ✗'+info)}
