
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>FPS AR - Protótipo</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  overflow: hidden;
  background: #000;
  color: white;
  font-family: Arial, sans-serif;
}

#camera {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  z-index: 0;
}

#effects {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 1;
  pointer-events: none;
}

#hud {
  position: fixed;
  inset: 0;
  z-index: 2;
  pointer-events: none;
}

#crosshair {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 24px;
  height: 24px;
  transform: translate(-50%, -50%);
}

#crosshair::before,
#crosshair::after {
  content: "";
  position: absolute;
  background: white;
  box-shadow: 0 0 5px #000;
}

#crosshair::before {
  width: 2px;
  height: 24px;
  left: 11px;
}

#crosshair::after {
  width: 24px;
  height: 2px;
  top: 11px;
}

button {
  border: 1px solid #ffffff70;
  border-radius: 10px;
  background: #101820e8;
  color: white;
  padding: 13px 18px;
  font-size: 15px;
  font-weight: bold;
}

#shoot {
  position: absolute;
  bottom: 35px;
  left: 50%;
  transform: translateX(-50%);
  width: 125px;
  height: 58px;
  border-radius: 30px;
  background: #087bce;
  border: 2px solid #8bd5ff;
  box-shadow: 0 0 15px #008cff80;
  pointer-events: auto;
}

#settingsButton {
  position: absolute;
  top: 18px;
  right: 15px;
  pointer-events: auto;
}

#cameraButton {
  position: absolute;
  top: 18px;
  left: 15px;
  pointer-events: auto;
}

#settings {
  display: none;
  position: fixed;
  z-index: 5;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: min(90%, 390px);
  max-height: 85vh;
  overflow-y: auto;
  padding: 20px;
  border: 1px solid #ffffff50;
  border-radius: 15px;
  background: #101820f5;
  box-shadow: 0 0 30px #000;
}

#settings h2 {
  margin-top: 0;
}

.setting {
  margin: 17px 0;
}

.setting label {
  display: block;
  margin-bottom: 9px;
}

.colors {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}

.color {
  width: 35px;
  height: 35px;
  border: 3px solid #ffffff70;
  border-radius: 50%;
  padding: 0;
}

.color.selected {
  outline: 3px solid white;
  outline-offset: 3px;
}

input[type="range"] {
  width: 100%;
}

select {
  width: 100%;
  padding: 10px;
  border-radius: 8px;
  background: #263746;
  color: white;
  border: 1px solid #ffffff50;
}

.toggle {
  display: flex;
  align-items: center;
  gap: 10px;
}

#closeSettings {
  width: 100%;
  margin-top: 12px;
}

#message {
  position: fixed;
  z-index: 4;
  top: 75px;
  left: 50%;
  transform: translateX(-50%);
  background: #000b;
  padding: 9px 14px;
  border-radius: 8px;
  font-size: 13px;
  display: none;
}
</style>
</head>

<body>

<video id="camera" autoplay playsinline muted></video>
<canvas id="effects"></canvas>

<div id="hud">
  <div id="crosshair"></div>

  <button id="cameraButton">CÂMERA</button>
  <button id="settingsButton">⚙ CONFIGURAÇÕES</button>
  <button id="shoot">DISPARAR</button>
</div>

<div id="message"></div>

<div id="settings">
  <h2>Configurações</h2>

  <div class="setting">
    <label>Cor dos disparos</label>
    <div class="colors">
      <button class="color selected" data-color="#00aaff"
        style="background:#00aaff"></button>
      <button class="color" data-color="#ff2020"
        style="background:#ff2020"></button>
      <button class="color" data-color="#00ff66"
        style="background:#00ff66"></button>
      <button class="color" data-color="#b000ff"
        style="background:#b000ff"></button>
      <button class="color" data-color="#ffe600"
        style="background:#ffe600"></button>
      <button class="color" data-color="#ffffff"
        style="background:#ffffff"></button>
    </div>
  </div>

  <div class="setting">
    <label>Qualidade dos efeitos</label>
    <select id="quality">
      <option value="high">Alta</option>
      <option value="medium">Média</option>
      <option value="low">Baixa</option>
    </select>
  </div>

  <div class="setting">
    <label class="toggle">
      <input type="checkbox" id="glow" checked>
      Brilho dos disparos
    </label>
  </div>

  <div class="setting">
    <label class="toggle">
      <input type="checkbox" id="trails" checked>
      Rastros luminosos
    </label>
  </div>

  <div class="setting">
    <label class="toggle">
      <input type="checkbox" id="explosions" checked>
      Clarão dos impactos
    </label>
  </div>

  <hr>

  <h3>Áudio</h3>

  <div class="setting">
    <label class="toggle">
      <input type="checkbox" id="audioEnabled" checked>
      Ativar áudio
    </label>
  </div>

  <div class="setting">
    <label>Volume geral</label>
    <input type="range" id="volume" min="0" max="100" value="85">
  </div>

  <div class="setting">
    <label class="toggle">
      <input type="checkbox" id="shotSound" checked>
      Som dos disparos
    </label>
  </div>

  <div class="setting">
    <label class="toggle">
      <input type="checkbox" id="impactSound" checked>
      Som dos impactos
    </label>
  </div>

  <button id="closeSettings">FECHAR</button>
</div>

<script>
const camera = document.getElementById("camera");
const canvas = document.getElementById("effects");
const ctx = canvas.getContext("2d");

let projectiles = [];
let impacts = [];
let selectedColor = "#00aaff";
let audioContext = null;

const settings = {
  glow: true,
  trails: true,
  explosions: true,
  quality: "high",
  audio: true,
  shotSound: true,
  impactSound: true,
  volume: 0.85
};

// Ajusta a resolução do canvas
function resizeCanvas() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);

  canvas.width = window.innerWidth * dpr;
  canvas.height = window.innerHeight * dpr;

  canvas.style.width = window.innerWidth + "px";
  canvas.style.height = window.innerHeight + "px";

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

window.addEventListener("resize", resizeCanvas);
resizeCanvas();

function showMessage(text) {
  const el = document.getElementById("message");
  el.textContent = text;
  el.style.display = "block";

  clearTimeout(showMessage.timer);
  showMessage.timer = setTimeout(() => {
    el.style.display = "none";
  }, 2200);
}

// Inicializa o áudio após interação do usuário
function initAudio() {
  if (!audioContext) {
    audioContext = new (window.AudioContext ||
      window.webkitAudioContext)();
  }

  if (audioContext.state === "suspended") {
    audioContext.resume();
  }
}

// Som eletrônico agudo: "psiuuu!"
function playShotSound() {
  if (!settings.audio || !settings.shotSound) return;

  initAudio();

  const now = audioContext.currentTime;
  const master = audioContext.createGain();

  master.gain.setValueAtTime(
    0.0001, now
  );

  master.gain.exponentialRampToValueAtTime(
    settings.volume * 0.65, now + 0.015
  );

  master.gain.exponentialRampToValueAtTime(
    0.0001, now + 0.38
  );

  master.connect(audioContext.destination);

  // Tom agudo com queda de frequência
  const osc = audioContext.createOscillator();
  const oscGain = audioContext.createGain();

  osc.type = "sawtooth";

  osc.frequency.setValueAtTime(1900, now);
  osc.frequency.exponentialRampToValueAtTime(
    520, now + 0.32
  );

  oscGain.gain.setValueAtTime(0.65, now);
  oscGain.gain.exponentialRampToValueAtTime(
    0.001, now + 0.34
  );

  osc.connect(oscGain);
  oscGain.connect(master);

  osc.start(now);
  osc.stop(now + 0.36);

  // Ruído filtrado para dar o efeito de passagem
  const bufferSize = Math.floor(audioContext.sampleRate * 0.4);
  const buffer = audioContext.createBuffer(
    1, bufferSize, audioContext.sampleRate
  );

  const data = buffer.getChannelData(0);

  for (let i = 0; i < bufferSize; i++) {
    data[i] = Math.random() * 2 - 1;
  }

  const noise = audioContext.createBufferSource();
  const filter = audioContext.createBiquadFilter();
  const noiseGain = audioContext.createGain();

  noise.buffer = buffer;
  filter.type = "bandpass";
  filter.frequency.setValueAtTime(2800, now);
  filter.frequency.exponentialRampToValueAtTime(
    650, now + 0.28
  );
  filter.Q.value = 1.2;

  noiseGain.gain.setValueAtTime(0.35, now);
  noiseGain.gain.exponentialRampToValueAtTime(
    0.001, now + 0.3
  );

  noise.connect(filter);
  filter.connect(noiseGain);
  noiseGain.connect(master);

  noise.start(now);
  noise.stop(now + 0.32);
}

function playImpactSound() {
  if (!settings.audio || !settings.impactSound) return;

  initAudio();

  const now = audioContext.currentTime;
  const osc = audioContext.createOscillator();
  const gain = audioContext.createGain();

  osc.type = "triangle";
  osc.frequency.setValueAtTime(180, now);
  osc.frequency.exponentialRampToValueAtTime(
    55, now + 0.22
  );

  gain.gain.setValueAtTime(
    settings.volume * 0.35, now
  );

  gain.gain.exponentialRampToValueAtTime(
    0.001, now + 0.24
  );

  osc.connect(gain);
  gain.connect(audioContext.destination);

  osc.start(now);
  osc.stop(now + 0.25);
}

// Cria um disparo em perspectiva
function shoot() {
  initAudio();
  playShotSound();

  if (projectiles.length >= 12) {
    projectiles.shift();
  }

  const w = window.innerWidth;
  const h = window.innerHeight;

  projectiles.push({
    startX: w / 2,
    startY: h * 0.94,
    endX: w / 2,
    endY: h / 2,
    progress: 0,
    speed: settings.quality === "low" ? 0.022 :
           settings.quality === "medium" ? 0.018 : 0.015,
    color: selectedColor,
    size: settings.quality === "low" ? 12 : 17
  });
}

// Desenha um projétil avançando em profundidade
function drawProjectile(p) {
  const t = Math.min(p.progress, 1);

  // Movimento da parte inferior em direção à mira
  const x = p.startX + (p.endX - p.startX) * t;
  const y = p.startY + (p.endY - p.startY) * t;

  // O projétil diminui conforme se afasta
  const perspective = 1 - t * 0.82;
  const radius = p.size * perspective;

  // Rastro atrás do projétil
  if (settings.trails) {
    const trailProgress = Math.max(0, t - 0.17);

    const trailX = p.startX +
      (p.endX - p.startX) * trailProgress;

    const trailY = p.startY +
      (p.endY - p.startY) * trailProgress;

    ctx.save();

    ctx.lineCap = "round";
    ctx.lineWidth = Math.max(1.5, radius * 0.65);

    const gradient = ctx.createLinearGradient(
      x, y, trailX, trailY
    );

    gradient.addColorStop(0, p.color);
    gradient.addColorStop(1, "transparent");

    ctx.strokeStyle = gradient;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(trailX, trailY);
    ctx.stroke();

    ctx.restore();
  }

  // Halo luminoso
  if (settings.glow) {
    ctx.save();

    ctx.shadowBlur = settings.quality === "high" ? 24 :
                     settings.quality === "medium" ? 14 : 5;

    ctx.shadowColor = p.color;
    ctx.fillStyle = p.color;

    ctx.beginPath();
    ctx.arc(x, y, radius * 1.3, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }

  // Núcleo do disparo
  ctx.fillStyle = "#ffffff";
  ctx.beginPath();
  ctx.arc(x, y, Math.max(1.5, radius * 0.45), 0, Math.PI * 2);
  ctx.fill();

  // Corpo colorido
  ctx.fillStyle = p.color;
  ctx.beginPath();
  ctx.arc(x, y, Math.max(2, radius * 0.8), 0, Math.PI * 2);
  ctx.fill();

  return { x, y };
}

function createImpact(x, y, color) {
  impacts.push({
    x,
    y,
    color,
    life: 1
  });

  playImpactSound();
}

function drawImpact(impact) {
  if (!settings.explosions) return;

  const radius = (1 - impact.life) * 32 + 3;

  ctx.save();
  ctx.globalAlpha = impact.life;

  ctx.shadowBlur = 18;
  ctx.shadowColor = impact.color;
  ctx.strokeStyle = impact.color;
  ctx.lineWidth = 3;

  ctx.beginPath();
  ctx.arc(
    impact.x,
    impact.y,
    radius,
    0,
    Math.PI * 2
  );
  ctx.stroke();

  ctx.fillStyle = "#ffffff";
  ctx.globalAlpha = impact.life * 0.7;

  ctx.beginPath();
  ctx.arc(impact.x, impact.y, 3, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

// Loop de animação
function render() {
  const w = window.innerWidth;
  const h = window.innerHeight;

  ctx.clearRect(0, 0, w, h);

  for (let i = projectiles.length - 1; i >= 0; i--) {
    const p = projectiles[i];

    p.progress += p.speed;

    const position = drawProjectile(p);

    if (p.progress >= 1) {
      createImpact(position.x, position.y, p.color);
      projectiles.splice(i, 1);
    }
  }

  for (let i = impacts.length - 1; i >= 0; i--) {
    const impact = impacts[i];

    drawImpact(impact);
    impact.life -= 0.055;

    if (impact.life <= 0) {
      impacts.splice(i, 1);
    }
  }

  requestAnimationFrame(render);
}

render();

// Câmera
async function startCamera() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: { ideal: "environment" }
      },
      audio: false
    });

    camera.srcObject = stream;
    await camera.play();

    showMessage("Câmera ativada");
  } catch (error) {
    showMessage("Não foi possível acessar a câmera");
  }
}

document.getElementById("cameraButton").onclick = startCamera;
document.getElementById("shoot").onclick = shoot;

// Configurações
document.getElementById("settingsButton").onclick = () => {
  document.getElementById("settings").style.display = "block";
};

document.getElementById("closeSettings").onclick = () => {
  document.getElementById("settings").style.display = "none";
};

document.querySelectorAll(".color").forEach(button => {
  button.onclick = () => {
    document.querySelectorAll(".color").forEach(b =>
      b.classList.remove("selected")
    );

    button.classList.add("selected");
    selectedColor = button.dataset.color;
  };
});

document.getElementById("glow").onchange = e => {
  settings.glow = e.target.checked;
};

document.getElementById("trails").onchange = e => {
  settings.trails = e.target.checked;
};

document.getElementById("explosions").onchange = e => {
  settings.explosions = e.target.checked;
};

document.getElementById("quality").onchange = e => {
  settings.quality = e.target.value;
};

document.getElementById("audioEnabled").onchange = e => {
  settings.audio = e.target.checked;
};

document.getElementById("shotSound").onchange = e => {
  settings.shotSound = e.target.checked;
};

document.getElementById("impactSound").onchange = e => {
  settings.impactSound = e.target.checked;
};

document.getElementById("volume").oninput = e => {
  settings.volume = Number(e.target.value) / 100;
};

// Fecha a câmera ao sair da página
window.addEventListener("pagehide", () => {
  if (camera.srcObject) {
    camera.srcObject.getTracks().forEach(track => track.stop());
  }
});

// Inicia a câmera
startCamera();
</script>

</body>
</html>
